modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# RP Core — общая библиотека семейства RP: обязательна (розетка инвентаря, источники поправок).
[[dependencies.${mod_id}]]
    modId="rpcore"
    mandatory=true
    versionRange="[0.15,)"
    ordering="AFTER"
    side="BOTH"

# Curios — ограничение типов слотов; без него этой части нет.
[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=false
    versionRange="[5.4,)"
    ordering="AFTER"
    side="BOTH"

# InventoryFree делает то же самое по-другому — вместе нельзя.
[[dependencies.${mod_id}]]
    modId="inventoryfree"
    mandatory=false
    versionRange="(,0)"
    ordering="NONE"
    side="BOTH"
