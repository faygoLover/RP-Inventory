buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('username')) args '--username', project.property('username')
            if (project.hasProperty('world')) args '--quickPlaySingleplayer', project.property('world')
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // Проверка загрузки: ./gradlew runGameTestServer — сервер стартует и выходит.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

// Вставки в ванильные Slot, Inventory, AbstractContainerMenu, выбор ячейки хотбара.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    flatDir { dir 'libs' }
    // Связанные моды из сборки — только для запуска разработки, в git не попадают.
    flatDir { dir 'libs/pack' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // RP Core — общая библиотека семейства: розетка инвентаря, источники поправок.
    implementation fg.deobf("blank:rpcore:${rpcore_version}")
    // Curios — ограничение типов слотов; в игре необязателен (без него этой части нет).
    compileOnly fg.deobf("blank:curios-forge:${curios_version}")
    def flag = { String name -> (project.findProperty(name) ?: 'false').toString().toBoolean() }
    if (flag('with_curios')) runtimeOnly fg.deobf("blank:curios-forge:${curios_version}")
    // Связанные моды сборки (libs/pack/<имя>-1.jar): -Pwith_pack=true.
    if (flag('with_pack')) {
        fileTree('libs/pack').matching { include '*-1.jar' }.each { f ->
            runtimeOnly fg.deobf("blank:${f.name.replace('-1.jar', '')}:1")
        }
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // В сборку для игроков не идут игровые тесты и их площадка; для разработки они остаются.
    exclude 'faygolover/rpinventory/gametest/**', 'data/rpinventory/structures/**'

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
